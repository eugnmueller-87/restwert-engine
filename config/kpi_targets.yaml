# KPI targets and savings plan for the Restwert Engine (SPEC 7.5).
# THE MODEL ADVISES, DETERMINISTIC CODE DECIDES, A NAMED HUMAN OWNS EVERY THRESHOLD.
#
# Every value here is a placeholder set for the synthetic dataset. None quotes an
# external benchmark. Replace the owners with real names before use on real data.
version: 1
savings_plan_owner: "Head of Indirect Procurement (name)"
# Placeholder plan, deliberately scaled to what the synthetic generator produces: about 5 to
# 7 kEUR of confirmed HARD savings per year (indirect_saving_share x hard share x confirmed
# share on ~2,160 invoices with a 1,800 EUR median). Only hard_price_reduction counts; cost
# avoidance and rebates are reported next to it. Not a market or company figure; replace on real data.
savings_plan_eur: {2024: 6000, 2025: 7000, 2026: 8000}
targets_owner: "CFO (name)"
targets:
  KPI_TOP_LIFECYCLE_MARGIN: 40
  KPI_TOP_RV_FORECAST_ERROR: 0.12
  KPI_PROC_SUPPLIER_OTIF: 0.90
  KPI_PROC_SPEND_UNDER_CONTRACT: 0.85
  KPI_INV_AGING_90: 0.10
  KPI_REC_GRADING_ACCURACY: 0.80
  KPI_IND_MAVERICK_SHARE: 0.10
# v0.2 gold KPIs: minimum sample size before a value is reported as measurable (n = the
# observations the KPI counts: serials, closed devices, sales, units; deliveries for the
# unresolved share; additive levers for the lever KPI). Below min_n the value is stored for
# reference and flagged not_measurable, the tile reads n/a with the reason. Placeholders,
# consistent with min_n_for_realised_inputs in assumptions.yaml; owned like the targets.
min_n_owner: "CFO (name)"
min_n:
  KPI_DATA_CHAIN_COMPLETE: 30
  KPI_DATA_UNRESOLVED_SHARE: 1
  KPI_DATA_RECONCILED: 30
  KPI_PUR_DISCOUNT_VS_RRP: 30
  KPI_PUR_LANDED_VS_RRP: 30
  KPI_PUR_PRICE_PROTECTION_CAPTURE: 30
  KPI_TCO_PER_CLOSED_DEVICE: 30
  KPI_TCO_ESTIMATE_SHARE: 30
  KPI_RES_ESTIMATE_VS_ANCHOR: 30
  KPI_RSL_REALISED_VS_RECORD: 30
  KPI_RSL_DAYS_RETURN_TO_CASH: 30
  KPI_RSLT_CLOSED_PER_DEVICE: 30
  KPI_LEV_ADDITIVE_EUR_PA: 1
  KPI_CTR_COVERAGE_BY_OEM: 30
  # Set D of the KPI frame (ESG, Fassung 4). Keyed by the frame number because there is no gold
  # KPI id behind them; only web/tools/gen/make_kpis_data.py reads these. n = closed devices in the
  # window (D1, D4), closed devices with a second life and an avoidance factor (D2), closed defect
  # tickets (D3). Below min_n the tile reads n/a with the reason, and a month below min_n does not
  # count for the baseline. Placeholders like the rest of this block; owned by min_n_owner.
  D1: 30
  D2: 30
  D3: 30
  D4: 30
