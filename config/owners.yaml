# The five category manager roles of the KPI frame, for the KPI tracker (web tab KPIs).
# THE MODEL ADVISES, DETERMINISTIC CODE DECIDES, A NAMED HUMAN OWNS EVERY THRESHOLD.
#
# Since 04.10.2026 without the indirect procurement: the four roles "Indirekt 1" to "Indirekt 4" became
# three service roles around the device (device management and connectivity, logistics, repair and
# refurbishment); consulting, marketing, facilities and the like are not part of the tool any more.
# Role codes only, never names: the page shows "Service 3" and "Resale 1", nothing per person.
# The tracker books every event that carries an actor to one role through this file:
#   partner contracts by their engine category (categories),
#   device events (decision log, price protection credits) by the device family (families),
#   hardware contracts by the OEMs they cover, through the catalogue families of those OEMs; an OEM that
#   sells to more than one role (Apple: Smartphone, Tablet, Laptop) books to Team.
# A category or family that is not listed here books to Team, never to a guessed role.
# The engine keeps two spellings of a family: the decision log writes iphone_like, android_like,
# tablet_like, laptop_like; the ledger and the catalogue write Smartphone, Tablet, Laptop. Both are listed.
version: 1
owner: "Leitung"
roles:
  S1:
    label: "Service 1"
    scope: "Geräteverwaltung (MDM), Mobilfunk und Konnektivität, Sicherheitssoftware"
    categories: [software, security_software, connectivity]
  S2:
    label: "Service 2"
    scope: "Logistik: Versand, Austausch, Rücksendung"
    categories: [logistics]
  S3:
    label: "Service 3"
    scope: "Reparatur, Aufbereitung, Ersatzteile, Werkstätten, Datenlöschung"
    categories: [repair, refurbishment]
  R1:
    label: "Resale 1"
    scope: "Smartphones und Tablets"
    families: [iphone_like, android_like, tablet_like, Smartphone, Tablet]
  R2:
    label: "Resale 2"
    scope: "Laptops"
    families: [laptop_like, Laptop]
team:
  label: "Team"
  # engine categories that no single role owns: hardware is device purchasing (booked by OEM, see above),
  # rental, resale_channel and financing are costs of the fleet as a whole
  categories: [hardware, rental, resale_channel, financing]
# the owner placeholders of config/kpi_targets.yaml, mapped to the roles above (a list means: all of them)
placeholders:
  "CFO (name)": "Leitung"
