# Restwert Engine: synthetic generator configuration (SPEC.md section 2.9).
#
# EVERY value in this file is a synthetic DESIGN PARAMETER. None of them is a market
# figure, a customer figure or an employer figure. The "truth" blocks describe the
# hidden ground-truth residual value curve the generator prices resale with; the
# forecaster never reads them and has to recover the curve from realised prices.
#
# Plugging in real data: replace the launch calendar (first_launch, launch_cadence_months)
# per family with your own; the other blocks are then unused because you load your own CSVs.
#
# Owners: this v0.1 file carries NO owners list of its own. The role that signs each design
# parameter is named once, in config/lake.yaml under design_parameter_owners, which is the
# leading configuration for v0.2 (generate-lake); the v0.1 generator reads this file but the
# blocks shared with lake.yaml (families, term_mix, channel_mult, fee_pct, defects, ...) are
# owned there. A block that exists only here and needs a decision is added to that list, not
# to a second list in this file.
#
# term_mix per family = share of new rental contracts per term in months (12/24/36/48, the business
# owner's term set); the shares are placeholders. The legacy scalar term_mix_36 is still accepted
# and means {24: 1 - term_mix_36, 36: term_mix_36}.
version: 1
seed: 42
n_devices: 4000
history_start: 2022-01-01
purchase_end: 2026-03-31   # six months before as_of, as before (2025-12-31 to 2026-06-30)
as_of: 2026-09-13          # the date of the public price evidence (data/anchors), so simulation and market page share one Stichtag
families:
