    first_launch: 2019-09-15
    launch_cadence_months: 12
    launch_month: 9
    list_price_min: 799
    list_price_max: 1299
    storage_options: [128, 256, 512]
    base_storage_gb: 128
    discount_min: 0.08
    discount_max: 0.18
    freight_duty_pct: 0.035
    share_of_fleet: 0.50
    term_mix: {12: 0.10, 24: 0.50, 36: 0.35, 48: 0.05}   # placeholder shares, no public source; same values as config/lake.yaml
    monthly_rate_pct_of_landed: 0.042
    damage_rate_pa: 0.10
    repair_share: 0.70
    repair_cost_min: 60
    repair_cost_max: 320
    truth: {base: 0.92, lambda: 0.028, lambda_after_24: 0.017, step: 0.88, noise: 0.10, storage_exp: 0.08, grade_A: 1.00, grade_B: 0.88, grade_C: 0.72, grade_D: 0.45}
